<body>

    <!-- The placeholder container -->
    <div id="UIContainer"></div>

    <!-- Main Body -->
    <main id="main-body">
        <h1 style="display: none;">You've been rickrolled!</h1>
        <p style="display: none;">Happy april fools! >:3</p>
        <video id="video" autoplay loop playsinline>
            <source src="/files/Vids/Rick.mp4" type="video/mp4">
        </video>
        <script>
            (function () {
                const v = document.getElementById('video');
                function tryPlay() { v.play().catch(() => { }); }
                if (document.readyState === 'complete' || document.readyState === 'interactive') tryPlay();
                else {
                    const startAttempts = () => {
                        if (tryPlay()) return;
                        const id = setInterval(() => {
                            const vid = document.querySelector('video');
                            if (!vid) return;
                            const playPromise = vid.play();
                            if (playPromise !== undefined) {
                                playPromise.then(() => {
                                    const h = document.querySelector('h1');
                                    const p = document.querySelector('p');
                                    if (h) h.style.display = 'block';
                                    if (p) p.style.display = 'block';
                                    clearInterval(id);
                                }).catch(() => { /* ignore play failure, keep trying */ });
                            }
                        }, 500);
                    };
                    document.addEventListener('DOMContentLoaded', startAttempts);
                    if (document.readyState === 'complete' || document.readyState === 'interactive') startAttempts();
                }
            })();
        </script>
    </main>




</body>
